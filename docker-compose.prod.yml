# Production. À lancer depuis le dossier du projet, avec le fichier d'environnement :
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# (modèle : .env.production.example). Pour le développement, voir docker-compose.yml.

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.prod
    target: app
  image: gestion-personnel-app:latest
  restart: unless-stopped
  env_file: .env.production
  environment:
    APP_KEY: "${APP_KEY:?APP_KEY manquante, la générer avec artisan key:generate --show}"
  volumes:
    - storage-data:/var/www/html/storage
  networks:
    - gestion-personnel

services:
  # PHP-FPM. Au démarrage : migrations puis mise en cache de la configuration.
  app:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy

  # Exécute les tâches planifiées de routes/console.php, dont l'accumulation
  # mensuelle des soldes de congé (conges:accumuler-soldes, le 1er du mois).
  scheduler:
    <<: *app
    command: php artisan schedule:work
    user: www-data
    depends_on:
      mysql:
        condition: service_healthy

  # nginx n'est joignable que par Caddy : pas de port publié.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: web
    image: gestion-personnel-web:latest
    restart: unless-stopped
    volumes:
      - storage-data:/var/www/html/storage:ro
    networks:
      - gestion-personnel
    depends_on:
      - app

  # Seul point d'entrée : HTTPS (certificat automatique) et redirection du HTTP.
  # caddy-data contient les certificats : à conserver (limites de Let's Encrypt).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN manquant, nom de domaine ou adresse du serveur}"
      APP_TLS: "${APP_TLS:?APP_TLS manquant, e-mail de contact Let's Encrypt ou internal}"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - gestion-personnel
    depends_on:
      - web

  # Pas de port publié : MySQL n'est joignable que par les autres conteneurs.
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD manquant}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gestion-personnel

volumes:
  mysql-data:
  storage-data:
  caddy-data:
  caddy-config:

networks:
  gestion-personnel:
    driver: bridge
