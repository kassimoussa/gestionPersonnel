services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gestion_personnel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - gestion-personnel
    depends_on:
      - mysql

  # Exécute les tâches planifiées de routes/console.php, dont l'accumulation
  # mensuelle des soldes de congé (conges:accumuler-soldes, le 1er du mois).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gestion_personnel_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    networks:
      - gestion-personnel
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: gestion_personnel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gestion-personnel
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: gestion_personnel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_personnel
      MYSQL_USER: gestion_personnel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - gestion-personnel

volumes:
  mysql-data:

networks:
  gestion-personnel:
    driver: bridge
