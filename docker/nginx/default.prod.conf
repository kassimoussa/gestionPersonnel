# Derrière Caddy (HTTPS), PHP doit savoir que la requête d'origine est en https
# pour générer des URL https (Livewire, redirections).
map $http_x_forwarded_proto $forwarded_https {
    default "";
    https   on;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;

    # Adresse réelle du visiteur (transmise par Caddy) plutôt que celle de Caddy ;
    # n'est crue que si elle vient du réseau Docker (plages privées).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Pièces jointes (justificatifs d'absence, photos, imports) : la valeur par
    # défaut de nginx est 1 Mo, en deçà de ce que l'application accepte.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
