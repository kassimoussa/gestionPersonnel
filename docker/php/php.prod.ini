; Pièces jointes (justificatifs, photos, imports) : le défaut PHP est 2 Mo,
; en deçà des 8 Mo acceptés par nginx (client_max_body_size).
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
